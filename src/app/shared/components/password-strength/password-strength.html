<div class="password-strength">
  <div class="password-strength__summary">
    <span class="password-strength__label">Força da senha</span>
    <strong class="password-strength__value">{{ label() }}</strong>
  </div>

  <div class="password-strength__bars" aria-hidden="true">
    @for (check of checks(); track check.label; let index = $index) {
      <span
        class="password-strength__bar"
        [class.password-strength__bar--active]="index < score()"
      ></span>
    }
  </div>

  <div class="password-strength__checks">
    @for (check of checks(); track check.label) {
      <span
        class="password-strength__check"
        [class.password-strength__check--valid]="check.valid"
      >
        {{ check.label }}
      </span>
    }
  </div>
</div>
